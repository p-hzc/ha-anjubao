name: Bug 报告
description: 实体没出现、控制没反应、日志报错
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        报问题前请先看 README 的「限制」一节，有两个已知行为不是 bug：
        - 走云端时手机 App 会把 HA 顶下线（服务端强制 `clientId == userId`）
        - 面板按键只有绑定了场景才会生成实体，没绑的按键没有可控制的东西
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant 版本
      placeholder: 例如 2026.10.3
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: 集成版本
      placeholder: 例如 0.8.0
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: 当前走的哪条通道
      description: 在「诊断信息」里的 transport.active 可以看到
      options:
        - 局域网直连（lan）
        - 厂商云（cloud）
        - 两条都不通（none）
        - 不确定
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 具体现象
      description: 哪类实体、哪个房间、做了什么操作、期望什么结果
      placeholder: 客厅窗帘的 cover 实体存在，但点「关闭」后窗帘没动，日志也没有报错
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息
      description: |
        设置 → 设备与服务 → 安居家园 Plus → 右上角「⋮」→ 下载诊断信息，
        把下载到的 JSON 内容贴进来。里面不含密码和令牌，可以放心公开。
      render: json
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        在 `configuration.yaml` 里开启调试后重启，复现一次，再贴日志：
        ```yaml
        logger:
          logs:
            custom_components.anjubao: debug
        ```
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已经看过 README 的「限制」一节
          required: true
        - label: 我贴的日志里已经去掉了手机号、密码等信息
          required: true
